packages:
  - apps/*
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  spawn-sync: true

dedupePeers: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - prosemirror-flat-list
  - prosemirror-view

# Keep the block-reference and transclusion editor contract pinned to the fork
# commit that produced these release assets. Direct dependencies and transitive
# workspace edges must resolve to the same three-package snapshot.
overrides:
  '@meowdown/core': https://github.com/jasonlong/meowdown/releases/download/block-ref-snapshot-85726fc/meowdown-core-0.58.0.tgz
  '@meowdown/markdown': https://github.com/jasonlong/meowdown/releases/download/block-ref-snapshot-85726fc/meowdown-markdown-0.58.0.tgz
  '@meowdown/react': https://github.com/jasonlong/meowdown/releases/download/block-ref-snapshot-85726fc/meowdown-react-0.58.0.tgz
blockExoticSubdeps: false
